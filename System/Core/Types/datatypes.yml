# Generated from datatypes.xml during PHP 8 migration.
---
type:
  SM_DATATYPE_SL_TEXT:
    id: SM_DATATYPE_SL_TEXT
    valuetype: string
    label: Short text field
    description: >
      A short, single line of text such as
      first or last name. Maximum 255
      characters.
    usage: field,itemproperty,dropdown
    class: SmartestString
    long: 'true'
    sortable: 'true'
    searchable: 'true'
    render:
      template: >
        System/Presentation/WebPageBuilder/property.default.tpl
    input:
      template: >
        System/Presentation/InterfaceBuilder/Inputs/sl_text.tpl
    parameters:
      param:
        - 
          name: autocomplete
          label: Auto-complete
          type: SM_DATATYPE_BOOLEAN
          default: 'true'
          usage: itemproperty
        - 
          name: require_unique
          label: Require unique values
          type: SM_DATATYPE_BOOLEAN
          default: 'false'
          usage: itemproperty
        - 
          name: pattern
          label: Validate using a given pattern
          type: SM_DATATYPE_SL_TEXT
          default: ""
          usage: itemproperty,field,dropdown
  SM_DATATYPE_ASSET:
    id: SM_DATATYPE_ASSET
    valuetype: foreignkey
    label: >
      File from the media library (formatted
      text, image, PDF, etc,)
    description: >
      A single file that has been imported
      into the files repository.
    usage: itemproperty
    long: 'false'
    searchable: 'true'
    filter:
      typesource:
        type: smartest:assettypes
        label: File Type
        template: >
          System/Applications/Items/Presentation/FKFilterSelectors/filtertype.assettypes.tpl
      entitysource:
        type: db
        table: Assets
        matchfield: asset_type
        sortfield: asset_stringid
        sitefield: asset_site_id
        sharedfield: asset_shared
        class: SmartestAsset
        label: File
      optionsettype:
        id: SM_PROPERTY_FILTERTYPE_ASSETGROUP
        class: SmartestAssetGroup
        table: Sets
        sitefield: set_site_id
        condition:
          field: set_type
          value: SM_SET_ASSETGROUP
          operator: EQUAL
      condition:
        - 
          field: asset_deleted
          value: "1"
          operator: NOT_EQUAL
        - 
          field: asset_is_archived
          value: "1"
          operator: NOT_EQUAL
    menu:
      value: id
      display: url
    render:
      template: >
        System/Presentation/WebPageBuilder/property.asset.tpl
    input:
      template: >
        System/Presentation/InterfaceBuilder/Inputs/asset.tpl
    class: SmartestRenderableAsset
