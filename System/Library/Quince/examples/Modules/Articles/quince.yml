module:
  class: Articles
  shortname: articles
  identifier: org.example.quince.Articles
  longname: Articles
  default_action: index

  aliases:
    - {url: /articles, action: index}

  routes:
    view:
      action: view
      url: /articles/:article_id
      params:
        format: full

  meta:
    example: true

  namespaces:
    ajax:
      class: ArticlesAjax
      content_type: application/json
      meta:
        template: null
